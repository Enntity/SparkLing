name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s install -v
      - run: python3 -m compileall -q install bench
      - run: shellcheck -S warning -e SC2054 start.sh install/*.sh bench/*.sh
      - run: ./start.sh --version
